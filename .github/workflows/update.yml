name: Update signalen
on:
  schedule:
    - cron: "30 21 * * 1-5"   # elke werkdag na beurssluiting (UTC)
    - cron: "0 7 * * 6,0"     # weekend: voor Bitcoin
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "update signalen" && git push)
